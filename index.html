<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <title>Para ti 🌻</title>


    <!-- FUENTES -->

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            overflow: hidden;

            font-family:
                "Poppins",
                sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #fffde9,
                    #fff3b5,
                    #f5d45b
                );

            color: #70551e;
        }


        /* =========================
           PANTALLA INICIAL
        ========================= */

        #inicio {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                opacity .8s ease;
        }

        #inicio.oculto {

            opacity: 0;

            pointer-events: none;
        }


        .tarjeta {

            width: min(
                430px,
                90vw
            );

            padding:
                45px 30px;

            text-align: center;

            background:
                rgba(
                    255,
                    253,
                    239,
                    .9
                );

            border-radius: 25px;

            box-shadow:
                0 20px 50px
                rgba(
                    120,
                    90,
                    20,
                    .18
                );

            animation:
                aparecer 1s ease;
        }


        .corazon {

            font-size: 40px;

            color: #d9a919;

            margin-bottom: 15px;

            animation:
                latido 2s infinite;
        }


        .tarjeta h1 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 45px;

            font-weight: 500;

            margin-bottom: 12px;
        }


        .tarjeta p {

            font-size: 14px;

            line-height: 1.7;

            color: #806b42;

            margin-bottom: 25px;
        }


        .boton {

            border: none;

            padding:
                13px 28px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #e9bb28,
                    #dca914
                );

            color: white;

            font-family:
                "Poppins",
                sans-serif;

            cursor: pointer;

            transition:
                transform .3s ease,
                box-shadow .3s ease;

            box-shadow:
                0 8px 20px
                rgba(
                    172,
                    125,
                    15,
                    .25
                );
        }


        .boton:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(
                    172,
                    125,
                    15,
                    .35
                );
        }


        /* =========================
           RAMO
        ========================= */

        #ramoPantalla {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 1.2s ease;
        }


        #ramoPantalla.mostrar {

            opacity: 1;

            visibility: visible;
        }


        .ramo {

            width: 430px;

            height: 510px;

            max-width: 90vw;

            max-height: 65vh;

            animation:
                balanceo 6s
                ease-in-out
                infinite;
        }


        .ramo svg {

            width: 100%;

            height: 100%;

            overflow: visible;
        }


        /* =========================
           TALLOS
        ========================= */

        .tallos path {

            fill: none;

            stroke: #648c32;

            stroke-width: 8;

            stroke-linecap: round;
        }


        /* =========================
           HOJAS
        ========================= */

        .hojas ellipse {

            fill: #709b38;
        }


        /* =========================
           FLORES
        ========================= */

        .petalo {

            fill: #f5c928;

            stroke: #dca915;

            stroke-width: 2;
        }


        .centro {

            fill: #8b5a19;

            stroke: #734814;

            stroke-width: 2;
        }


        .flor {

            transform-box:
                fill-box;

            transform-origin:
                center;

            animation:
                florEntrada 1s ease forwards;
        }


        .flor1 {
            animation-delay: .1s;
        }

        .flor2 {
            animation-delay: .2s;
        }

        .flor3 {
            animation-delay: .3s;
        }

        .flor4 {
            animation-delay: .4s;
        }

        .flor5 {
            animation-delay: .5s;
        }

        .flor6 {
            animation-delay: .6s;
        }


        @keyframes florEntrada {

            from {

                opacity: 0;

                transform:
                    scale(.6)
                    translateY(30px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        /* =========================
           PAPEL
        ========================= */

        .papel {

            position: absolute;

            left: 50%;

            bottom: 5px;

            width: 190px;

            height: 115px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    145deg,
                    #fff9d9,
                    #eee2ad
                );

            clip-path:
                polygon(
                    8% 0,
                    92% 0,
                    100% 100%,
                    0 100%
                );
        }


        .papel-lazo {

            position: absolute;

            left: 50%;

            top: 15px;

            width: 80px;

            height: 22px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                #e0b526;
        }


        /* =========================
           MENSAJE
        ========================= */

        .mensaje {

            margin-top: -20px;

            width: min(
                800px,
                90vw
            );

            text-align: center;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    23px,
                    3vw,
                    32px
                );

            opacity: 0;

            transform:
                translateY(15px);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }


        #ramoPantalla.mostrar
        .mensaje {

            opacity: 1;

            transform:
                translateY(0);

            transition-delay:
                1.2s;
        }


        /* =========================
           ANIMACIONES
        ========================= */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.95);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes latido {

            0%,
            100% {

                transform:
                    scale(1);
            }

            50% {

                transform:
                    scale(1.12);
            }
        }


        @keyframes balanceo {

            0%,
            100% {

                transform:
                    rotate(-1deg);
            }

            50% {

                transform:
                    rotate(1.5deg);
            }
        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 600px) {

            .tarjeta h1 {

                font-size: 36px;
            }

            .ramo {

                width: 340px;

                height: 410px;

                max-height: 58vh;
            }

            .mensaje {

                font-size: 22px;

                margin-top: 0;
            }
        }

    </style>

</head>

    <script>

                document.getElementById(
                    "ramoPantalla"

            /* Esperar un poquito */
