

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌻</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(circle at center, #fff9d9 0%, #f8e7a6 45%, #e8c96a 100%);
            color: #5b4615;
        }

        /* ---------------- INICIO ---------------- */

        #inicio {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .8s ease;
            z-index: 10;
        }

        #inicio.oculto {
            opacity: 0;
            pointer-events: none;
        }

        .tarjeta {
            width: min(90%, 430px);
            padding: 45px 35px;
            text-align: center;
            background: rgba(255,255,255,.65);
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(100,75,20,.18);
            backdrop-filter: blur(8px);
        }

        .corazon {
            font-size: 45px;
            color: #e4b51f;
            animation: latido 2s infinite;
        }

        .tarjeta h1 {
            margin: 15px 0 12px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 600;
        }

        .tarjeta p {
            margin: 0 auto 25px;
            max-width: 340px;
            line-height: 1.7;
            font-size: 14px;
            color: #77642d;
        }

        .boton {
            border: none;
            padding: 13px 25px;
            border-radius: 30px;
            background: #dcae24;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 8px 20px rgba(170,130,20,.25);
        }

        .boton:hover {
            transform: translateY(-3px);
            background: #c89b18;
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }

        /* ---------------- RAMO ---------------- */

        #ramoPantalla {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            opacity: 0;
            visibility: hidden;

            transition: opacity 1.2s ease;
        }

        #ramoPantalla.mostrar {
            opacity: 1;
            visibility: visible;
        }

        .ramo {
            position: relative;
            width: min(90vw, 500px);
            height: 600px;

            animation: balanceo 5s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .ramo svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---------------- FLORES ---------------- */

        .petalo {
            fill: #f4c928;
            stroke: #dcae16;
            stroke-width: 2;
        }

        .centro {
            fill: #9c7011;
        }

        .tallo {
            fill: none;
            stroke: #5d913b;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .hoja {
            fill: #70a84b;
        }

        /* Entrada de las flores */

        .flor {
            transform-origin: center;
            animation: aparecerFlor 1.3s ease both;
        }

        .flor:nth-of-type(2) {
            animation-delay: .15s;
        }

        .flor:nth-of-type(3) {
            animation-delay: .3s;
        }

        .flor:nth-of-type(4) {
            animation-delay: .45s;
        }

        .flor:nth-of-type(5) {
            animation-delay: .6s;
        }

        .flor:nth-of-type(6) {
            animation-delay: .75s;
        }

        @keyframes aparecerFlor {
            from {
                opacity: 0;
                transform: scale(.3);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes balanceo {
            0%, 100% {
                transform: rotate(-1deg);
            }

            50% {
                transform: rotate(1deg);
            }
        }

        /* ---------------- PAPEL ---------------- */

        .papel {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 210px;
            height: 150px;

            background: linear-gradient(
                135deg,
                #fff8d9,
                #f1dfa0
            );

            clip-path: polygon(
                8% 0,
                92% 0,
                100% 100%,
                50% 78%,
                0 100%
            );

            z-index: 5;
            box-shadow: 0 10px 20px rgba(70,50,10,.12);
        }

        .papel-lazo {
            position: absolute;
            left: 50%;
            top: 20px;
            transform: translateX(-50%);
            width: 55px;
            height: 25px;
        }

        .papel-lazo::before,
        .papel-lazo::after {
            content: "";
            position: absolute;
            top: 0;
            width: 28px;
            height: 25px;
            background: #dcae24;
            border-radius: 50% 50% 10% 50%;
        }

        .papel-lazo::before {
            right: 25px;
            transform: rotate(25deg);
        }

        .papel-lazo::after {
            left: 25px;
            transform: rotate(-25deg);
        }

        /* ---------------- DESTELLOS ---------------- */

        .destello {
            position: fixed;
            color: #fff;
            font-size: 22px;
            opacity: .7;
            animation: destellar 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        .d1 { top: 15%; left: 18%; animation-delay: .2s; }
        .d2 { top: 25%; right: 18%; animation-delay: 1s; }
        .d3 { top: 45%; left: 10%; animation-delay: .5s; }
        .d4 { top: 55%; right: 12%; animation-delay: 1.5s; }
        .d5 { bottom: 20%; left: 22%; animation-delay: .8s; }
        .d6 { bottom: 15%; right: 23%; animation-delay: 1.8s; }

        @keyframes destellar {
            0%, 100% {
                opacity: .15;
                transform: scale(.7) rotate(0deg);
            }

            50% {
                opacity: .9;
                transform: scale(1.3) rotate(20deg);
            }
        }

        /* ---------------- PÉTALOS QUE CAEN ---------------- */

        .petalos-caidos {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .petalo-caido {
            position: absolute;
            top: -30px;
            width: 13px;
            height: 20px;
            background: #f2c62b;
            border-radius: 80% 20% 80% 20%;
            opacity: .75;

            animation:
                caer linear infinite,
                girar 3s ease-in-out infinite;
        }

        @keyframes caer {
            from {
                transform: translateY(-30px) translateX(0) rotate(0deg);
            }

            to {
                transform: translateY(110vh) translateX(100px) rotate(360deg);
            }
        }

        @keyframes girar {
            0%, 100% {
                margin-left: 0;
            }

            50% {
                margin-left: -40px;
            }
        }

        /* ---------------- MENSAJE ---------------- */

        .mensaje {
            margin-top: -10px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 27px;
            color: #705618;
            text-align: center;
            z-index: 6;

            animation: aparecerMensaje 2s ease;
        }

        @keyframes aparecerMensaje {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------------- MÓVIL ---------------- */

        @media (max-width: 600px) {

            .tarjeta {
                padding: 35px 25px;
            }

            .tarjeta h1 {
                font-size: 34px;
            }

            .ramo {
                width: 95vw;
                height: 530px;
            }

            .mensaje {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- PANTALLA INICIAL -->

        <div class="tarjeta">

            <div class="corazon">♥</div>

            <h1>Tengo algo para ti...</h1>

                así que decidí mostrártelas de una manera diferente.

            <button class="boton" onclick="mostrarRamo()">

    <script>

        function mostrarRamo() {

            const inicio = document.getElementById("inicio");
            const ramoPantalla = document.getElementById("ramoPantalla");

            inicio.classList.add("oculto");

            setTimeout(function() {

                ramoPantalla.classList.add("mostrar");

                crearPetalos();

            }, 500);
        }


        function crearPetalos() {

            const contenedor = document.getElementById("petalosCaidos");

            /* Creamos 25 pétalos */

            for (let i = 0; i < 25; i++) {

                const petalo = document.createElement("div");

                petalo.classList.add("petalo-caido");

                /* Posición horizontal */

                petalo.style.left = Math.random() * 100 + "%";

                /* Tamaño */

                const tamaño = 8 + Math.random() * 9;

                petalo.style.width = tamaño + "px";
                petalo.style.height = tamaño * 1.4 + "px";

                /* Velocidad */

                const duracion = 5 + Math.random() * 7;

                petalo.style.animationDuration =
                    duracion + "s, " +
                    (2 + Math.random() * 2) + "s";

                /* Retraso */

                petalo.style.animationDelay =
                    Math.random() * 6 + "s";

                contenedor.appendChild(petalo);
            }
        }

    </script>
